<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DSO138 Open – Flasher</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='4' width='20' height='16' rx='2'/%3E%3Cpath d='M5 14l3-5 3 7 3-6 2 4h3'/%3E%3C/svg%3E">
	<link rel="stylesheet" href="app.css">
	<script type="module" src="src/app.js"></script>
</head>
<body class="min-h-screen bg-gray-50 font-sans text-gray-800 antialiased dark:bg-neutral-900 dark:text-neutral-200">
<div x-data="dso" x-cloak class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:py-12">

	<!-- Header -->
	<header class="mb-8 flex flex-wrap items-center justify-between gap-4">
		<div class="flex items-center gap-x-3">
			<span class="inline-flex size-11 items-center justify-center rounded-xl bg-blue-600 text-white">
				<svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M5 14l3-5 3 7 3-6 2 4h3"/></svg>
			</span>
			<div>
				<h1 class="text-xl font-semibold text-gray-900 dark:text-white">DSO138 Open</h1>
				<p class="text-sm text-gray-500 dark:text-neutral-400" x-text="t('subtitle')"></p>
			</div>
		</div>
		<label class="flex items-center gap-x-2 text-sm text-gray-500 dark:text-neutral-400">
			<span x-text="t('language')"></span>
			<select x-model="lang" class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-800 focus:border-blue-500 focus:ring-blue-500 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-200">
				<template x-for="l in languages" :key="l.code">
					<option :value="l.code" x-text="l.name" :selected="l.code === lang"></option>
				</template>
			</select>
		</label>
	</header>

	<div x-show="!supported" class="mb-6 rounded-xl border border-yellow-200 bg-yellow-50 p-4 text-sm text-yellow-800 dark:border-yellow-900 dark:bg-yellow-800/10 dark:text-yellow-500" role="alert">
		<span x-text="t('unsupported')"></span>
	</div>

	<div class="grid gap-6 lg:grid-cols-5">

		<!-- Flash card -->
		<section class="flex flex-col rounded-xl border border-gray-200 bg-white shadow-2xs lg:col-span-2 dark:border-neutral-700 dark:bg-neutral-800">
			<div class="border-b border-gray-200 px-5 py-4 dark:border-neutral-700">
				<h2 class="font-semibold text-gray-900 dark:text-white" x-text="t('flashTitle')"></h2>
				<p class="mt-1 text-sm text-gray-500 dark:text-neutral-400" x-text="t('flashDesc')"></p>
			</div>
			<div class="flex flex-1 flex-col gap-5 p-5">

				<!-- Preparation steps -->
				<div>
					<h3 class="mb-3 text-sm font-medium text-gray-800 dark:text-neutral-200" x-text="t('stepsTitle')"></h3>
					<ol class="space-y-3">
						<template x-for="n in [1, 2, 3, 4]" :key="n">
							<li class="flex gap-x-3 text-sm">
								<span class="inline-flex size-6 shrink-0 items-center justify-center rounded-full bg-blue-100 text-xs font-semibold text-blue-800 dark:bg-blue-500/20 dark:text-blue-400" x-text="n"></span>
								<span class="text-gray-600 dark:text-neutral-400" x-text="t('step' + n)"></span>
							</li>
						</template>
					</ol>
					<p class="mt-3 rounded-lg bg-gray-100 px-3 py-2 text-xs text-gray-600 dark:bg-neutral-700/50 dark:text-neutral-400" x-text="t('note')"></p>
				</div>

				<fieldset>
					<legend class="mb-2 text-sm font-medium text-gray-800 dark:text-neutral-200" x-text="t('source')"></legend>
					<div class="space-y-2">
						<label x-show="manifest" class="flex cursor-pointer items-start gap-x-3 rounded-lg border border-gray-200 p-3 has-checked:border-blue-600 has-checked:bg-blue-50 dark:border-neutral-700 dark:has-checked:border-blue-500 dark:has-checked:bg-blue-500/10">
							<input type="radio" value="release" x-model="source" class="mt-0.5 size-4 accent-blue-600">
							<span class="text-sm">
								<span class="block font-medium" x-text="t('sourceRelease', { version: manifest?.version })"></span>
								<span class="block text-xs text-gray-500 dark:text-neutral-400" x-text="manifest ? `${manifest.commit} · ${manifest.date} · ${manifest.size} B` : ''"></span>
							</span>
						</label>
						<label class="flex cursor-pointer items-start gap-x-3 rounded-lg border border-gray-200 p-3 has-checked:border-blue-600 has-checked:bg-blue-50 dark:border-neutral-700 dark:has-checked:border-blue-500 dark:has-checked:bg-blue-500/10">
							<input type="radio" value="original" x-model="source" class="mt-0.5 size-4 accent-blue-600">
							<span class="text-sm">
								<span class="block font-medium" x-text="t('sourceOriginal')"></span>
								<span class="block text-xs text-gray-500 dark:text-neutral-400" x-text="t('sourceOriginalDesc')"></span>
							</span>
						</label>
						<label class="flex cursor-pointer items-start gap-x-3 rounded-lg border border-gray-200 p-3 has-checked:border-blue-600 has-checked:bg-blue-50 dark:border-neutral-700 dark:has-checked:border-blue-500 dark:has-checked:bg-blue-500/10">
							<input type="radio" value="file" x-model="source" class="mt-0.5 size-4 accent-blue-600">
							<span class="min-w-0 flex-1 text-sm">
								<span class="block font-medium" x-text="t('sourceFile')"></span>
								<span x-show="source === 'file'" class="mt-2 flex items-center gap-x-2">
									<label class="inline-flex shrink-0 cursor-pointer items-center rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium shadow-2xs hover:bg-gray-50 dark:border-neutral-700 dark:bg-neutral-900 dark:hover:bg-neutral-800">
										<span x-text="t('chooseFile')"></span>
										<input type="file" accept=".hex,.bin" class="sr-only" @change="pickFile">
									</label>
									<span class="truncate text-xs text-gray-500 dark:text-neutral-400" x-text="file ? file.name : t('noFile')"></span>
								</span>
							</span>
						</label>
					</div>
				</fieldset>

				<div class="space-y-2">
					<label x-show="source === 'release'" class="flex items-center gap-x-3 text-sm">
						<input type="checkbox" x-model="keepSettings" class="size-4 rounded accent-blue-600">
						<span x-text="t('keepOpt')"></span>
					</label>
					<label class="flex items-center gap-x-3 text-sm">
						<input type="checkbox" x-model="verifyAfter" class="size-4 rounded accent-blue-600">
						<span x-text="t('verifyOpt')"></span>
					</label>
				</div>

				<div class="mt-auto space-y-3">
					<button type="button" @click="flash()" :disabled="busy || !supported"
						class="inline-flex w-full items-center justify-center gap-x-2 rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-700 focus:bg-blue-700 focus:outline-hidden disabled:pointer-events-none disabled:opacity-50">
						<svg x-show="busy" class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" class="opacity-25"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3"/></svg>
						<span x-text="t('flash')"></span>
					</button>

					<div x-show="busy || progress > 0" class="flex h-2 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-neutral-700" role="progressbar" :aria-valuenow="Math.round(progress * 100)" aria-valuemin="0" aria-valuemax="100">
						<div class="flex flex-col justify-center overflow-hidden rounded-full bg-blue-600 transition-all duration-200" :style="`width: ${Math.round(progress * 100)}%`"></div>
					</div>

					<div x-show="status" class="rounded-lg border p-3 text-sm" role="status"
						:class="{
							'border-blue-200 bg-blue-50 text-blue-800 dark:border-blue-900 dark:bg-blue-800/10 dark:text-blue-400': statusKind === 'info',
							'border-teal-200 bg-teal-50 text-teal-800 dark:border-teal-900 dark:bg-teal-800/10 dark:text-teal-400': statusKind === 'ok',
							'border-yellow-200 bg-yellow-50 text-yellow-800 dark:border-yellow-900 dark:bg-yellow-800/10 dark:text-yellow-500': statusKind === 'warn',
							'border-red-200 bg-red-50 text-red-800 dark:border-red-900 dark:bg-red-800/10 dark:text-red-500': statusKind === 'error',
						}">
						<p x-text="status"></p>
						<p x-show="chipInfo" class="mt-1 text-xs opacity-80" x-text="chipInfo"></p>
					</div>

					<div class="border-t border-gray-200 pt-4 dark:border-neutral-700">
						<button type="button" @click="backup()" :disabled="busy || !supported"
							class="inline-flex w-full items-center justify-center gap-x-2 rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm font-medium text-gray-800 shadow-2xs hover:bg-gray-50 disabled:pointer-events-none disabled:opacity-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-white dark:hover:bg-neutral-800">
							<span x-text="t('backup')"></span>
						</button>
						<p class="mt-2 text-xs text-gray-500 dark:text-neutral-400" x-text="t('backupDesc')"></p>
						<a x-show="backupUrl" :href="backupUrl" download="dso138-backup.bin" class="mt-2 inline-flex items-center gap-x-1 text-sm font-medium text-blue-600 hover:underline dark:text-blue-500" x-text="t('downloadBackup')"></a>
					</div>
				</div>
			</div>
		</section>

		<!-- Live view -->
		<section class="flex flex-col rounded-xl border border-gray-200 bg-white shadow-2xs lg:col-span-3 dark:border-neutral-700 dark:bg-neutral-800">
			<div class="flex flex-wrap items-start justify-between gap-3 border-b border-gray-200 px-5 py-4 dark:border-neutral-700">
				<div>
					<h2 class="font-semibold text-gray-900 dark:text-white" x-text="t('monitorTitle')"></h2>
					<p class="mt-1 text-sm text-gray-500 dark:text-neutral-400" x-text="device || t('monitorDesc')"></p>
				</div>
				<button type="button" @click="link ? disconnect() : connectMonitor()" :disabled="busy || !supported"
					class="inline-flex items-center gap-x-2 rounded-lg px-3 py-2 text-sm font-medium disabled:pointer-events-none disabled:opacity-50"
					:class="link ? 'border border-gray-200 bg-white text-gray-800 hover:bg-gray-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-white' : 'bg-blue-600 text-white hover:bg-blue-700'">
					<span class="size-2 rounded-full" :class="link ? 'bg-teal-500' : 'bg-white/70'"></span>
					<span x-text="link ? t('disconnect') : t('connect')"></span>
				</button>
			</div>
			<div class="flex flex-1 flex-col gap-4 p-5">
				<div class="relative overflow-hidden rounded-lg border border-gray-200 dark:border-neutral-700">
					<canvas x-ref="scope" class="block aspect-[3/2] w-full"></canvas>
					<div x-show="!frame" class="absolute inset-0 flex items-center justify-center text-sm text-slate-500" x-text="link ? t('waiting') : ''"></div>
				</div>

				<dl class="grid grid-cols-2 gap-3 sm:grid-cols-3">
					<template x-for="item in [
						['freq', stats && stats.freq ? si(stats.freq, 'Hz') : '–'],
						['vpp', stats ? si(stats.vpp, 'V') : '–'],
						['vrms', stats ? si(stats.rms, 'V') : '–'],
						['mean', stats ? si(stats.mean, 'V') : '–'],
						['timebase', frame ? si(frame.tdiv, 's', 2) : '–'],
						['vdiv', frame ? si(frame.vdiv, 'V', 2) : '–'],
					]" :key="item[0]">
						<div class="rounded-lg border border-gray-200 px-3 py-2 dark:border-neutral-700">
							<dt class="text-xs text-gray-500 dark:text-neutral-400" x-text="t(item[0])"></dt>
							<dd class="font-medium tabular-nums text-gray-900 dark:text-white" x-text="item[1]"></dd>
						</div>
					</template>
				</dl>

				<div class="flex flex-wrap gap-2">
					<button type="button" @click="setStream(!streaming)" :disabled="!link"
						class="inline-flex items-center gap-x-2 rounded-lg border px-3 py-2 text-sm font-medium disabled:pointer-events-none disabled:opacity-50"
						:class="streaming ? 'border-blue-600 bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400' : 'border-gray-200 bg-white text-gray-800 hover:bg-gray-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-white'">
						<span x-text="t('stream')"></span>
					</button>
					<button type="button" @click="capture()" :disabled="!link"
						class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-800 hover:bg-gray-50 disabled:pointer-events-none disabled:opacity-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-white">
						<span x-text="t('single')"></span>
					</button>
					<button type="button" @click="exportCsv()" :disabled="!frame"
						class="inline-flex items-center rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-800 hover:bg-gray-50 disabled:pointer-events-none disabled:opacity-50 dark:border-neutral-700 dark:bg-neutral-900 dark:text-white">
						<span x-text="t('exportCsv')"></span>
					</button>
				</div>

				<details class="mt-auto">
					<summary class="cursor-pointer text-sm font-medium text-gray-700 dark:text-neutral-300" x-text="t('log')"></summary>
					<pre class="mt-2 max-h-48 overflow-auto rounded-lg bg-gray-100 p-3 text-xs text-gray-700 dark:bg-neutral-900 dark:text-neutral-400" x-text="log.join('\n')"></pre>
				</details>
			</div>
		</section>
	</div>

	<footer class="mt-10 text-center text-xs text-gray-500 dark:text-neutral-500">
		<a href="https://github.com/sickdaflip/dso0138" class="font-medium text-blue-600 hover:underline dark:text-blue-500">github.com/sickdaflip/dso0138</a>
		<span class="mx-1">·</span>
		<span x-text="t('footer')"></span>
	</footer>
</div>
</body>
</html>
