; DSO138 open firmware
; Build:  pio run
; Flash:  use the browser flasher or `pio run -t upload` with a 3.3 V USB-TTL
;         adapter on J5 and JP1/JP2 bridged (STM32 serial bootloader).

[env:dso138]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
board_upload.maximum_size = 64512  ; last 1 KiB page holds the settings
build_flags =
	-Wall
	-Wextra
	-ffunction-sections
	-fdata-sections
build_unflags = -std=gnu++11 -std=gnu++14
build_src_flags = -std=gnu++17 -fno-exceptions -fno-rtti
upload_protocol = serial
upload_speed = 115200
monitor_speed = 115200
