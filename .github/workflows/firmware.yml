# Builds the firmware on every push and pull request.
# On main: publishes the browser flasher (with the current build) to GitHub Pages.
# On a v* tag: attaches .bin and .hex to the GitHub release.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e dso138

      - name: Collect artifacts
        id: meta
        run: |
          version=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/board.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          name="dso138-open-$version"
          cp .pio/build/dso138/firmware.bin "dist/$name.bin"
          ~/.platformio/packages/toolchain-gccarmnoneeabi/bin/arm-none-eabi-objcopy \
            -O ihex .pio/build/dso138/firmware.elf "dist/$name.hex"
          size=$(stat -c %s "dist/$name.bin")
          cat > dist/manifest.json <<JSON
          {
            "version": "$version",
            "commit": "${GITHUB_SHA::7}",
            "date": "$(date -u +%Y-%m-%d)",
            "bin": "$name.bin",
            "size": $size
          }
          JSON
          cat dist/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Flasher self-test
        run: |
          cd web
          node test/flash.test.mjs ../dist/dso138-open-*.bin
          node test/flash.test.mjs ../dist/dso138-open-*.hex
          node test/parser.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  site:
    needs: build
    # The github-pages environment only accepts deployments from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/public/firmware

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.bin dist/*.hex --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.bin dist/*.hex \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSO138 Open $tag" \
              --notes "Firmware ${{ needs.build.outputs.version }} for the JYE Tech DSO138. Flash it from the browser flasher or with any STM32 serial bootloader tool."
          fi
